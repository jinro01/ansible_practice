- name: ansible 파일 조작 실습
  hosts: all
  become: yes

  vars:
    target_file: /tmp/sample_app.config_block

  tasks:
    - name: lineinfile 특정 문자열 밑에 새로운 줄 추가하기
      lineinfile:
        path: "{{ target_file }}"
        insertafter: '^listen_port'
        line: 'timeout = 60'
        state: present
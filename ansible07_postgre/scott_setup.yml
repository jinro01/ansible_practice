- name: scott 계정으로 접속해서 sample 데이터 적재
  hosts: 172.16.1.202

  gather_facts: no
  vars:
    db_name: "scott_db"
    db_user: "scott"
    db_pass: "tiger"

  tasks:
    - name: 1. dept 테이블 생성
      postgresql_query:
        db: "{{ db_name }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_pass }}"
        login_host: "127.0.0.1"
        query: |
          CREATE TABLE IF NOT EXISTS dept(
          deptno INTEGER PRIMARY KEY,
          dname VARCHAR(14),
          loc VARCHAR(13));


    - name: 2. dept 테이블에 데이터 insert (실행할때 마다 쌓이지 않게 중복 방지)
      postgresql_query:
        db: "{{ db_name }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_pass }}"
        login_host: "127.0.0.1"  
        query: |
          INSERT INTO dept
          (deptno, dname, loc)
          VALUES
          (10, 'ACCOUNTING', 'NEW YORK'),
          (20, 'RESEARCH', 'DALLAS'),
          (30, 'SALES', 'CHICAGO'),
          (40, 'OPERATIONS', 'BOSTON')
          ON CONFLICT (deptno) DO NOTHING;

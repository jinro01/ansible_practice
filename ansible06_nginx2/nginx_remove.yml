- name: 모든 OS에 nginx 삭제
  hosts: all
  become: yes

  tasks:
    - name: 1. OS별 변수 불러오기
      include_vars: "vars/{{ ansible_distribution }}.yml"

    - name: 2. 서비스 중지 및 비활성화
      service:
        name: nginx
        state: stopped
        enabled: no
      ignore_errors: yes
    
    - name: 3-1. Rocky에서 nginx 삭제
      dnf:
        name: nginx
        state: absent
        autoremove: yes
      when: ansible_distribution == 'Rocky'

    - name: 3-2. Ubuntu에서 nginx 삭제
      apt:
        name: nginx
        state: absent
        purge: yes
        autoremove: yes
      when: ansible_distribution == 'Ubuntu'

    - name: 4. 설정파일, 로그, index.html 삭제
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx
        - /var/log/nginx
        - "{{ web_root }}/index.html"
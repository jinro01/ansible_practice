- name: rocky nginx 삭제
  hosts: rocky
  become: yes
  
  tasks:
    - name: 서비스 중지 및 비활성화
      service:
        state: stopped
        enabled: no
      ignore_errors: yes
    - name: nginx 패키지 삭제
      dnf:
        name: nginx
        state: absent
        autoremove: yes
    - name: 설정파일, 로그, index.html 삭제
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/ngiinx
        - /var/log/nginx
        - /usr/share/nginx/html/idenx.html
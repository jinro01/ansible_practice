- name: rocky linux에 nginx 셋업
  hosts: rocky
  become: yes

  tasks:
    - name: nginx 설치
      dnf:
        name: nginx
        state: present
    - name: 서비스 시작
      service:
        name: nginx
        state: started
        enabled: yes
    - name: index.html 템플릿 배포
      template:
        src: index.html
        dest: /usr/share/nginx/html
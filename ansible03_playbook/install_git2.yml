- name: Git 설치 및 사용자 환경 설정
  hosts: all
  become: yes

  vars:
    user_name: "jinro01"
    user_email: "jhjohn1305@gmail.com"

  tasks:
    - name: 1. Git 페키지 설치
      package:
        name: git
        state: present
   
    - name: 2. user.name 설정
      git_config:
        name: user.name
        value: "{{ user_name }}"
        scope: global
      become: yes
      become_user: user1
   
    - name: 3. user.email 설정
      git_config:
        name: user.email
        value: "{{ user_email }}"
        scope: global
      become: yes
      become_user: user1

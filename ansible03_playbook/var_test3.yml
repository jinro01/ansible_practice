- name: 외부 변수 활용 연습
  hosts: localhost
  become: yes

  vars_files:
    - ./variables/my_list.yml
  
  tasks:
    - name: 여러 개의 패키지를 한 번에 설치
      package:
        name: "{{ item }}"
        state: present
      loop: "{{ target_packages }}"
    - name: dict 형태의 변수를 참조해서 활용하기
      debug:
        msg: |
          번호 : {{ info.num }}
          이름 : {{ info.name }}
          주소 : {{ info.addr }}
    - name: list 안에 disct가 들어 있는 형태의 데이터 활용
      debug:
        msg: |
          번호 : {{ item.num }}
          이름 : {{ item.name }}
          주소 : {{ item.addr }}
      loop: "{{ members }}"